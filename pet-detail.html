<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de mascota - Clínica Veterinaria Vetusta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/client-area.css?v=20260527-flip-card">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Clínica Veterinaria Vetusta</a>
      <nav class="nav-actions">
        <a class="button secondary" href="/dashboard">Volver al panel</a>
        <button class="secondary" type="button" data-logout>Cerrar sesión</button>
      </nav>
    </div>
  </header>

  <main class="shell pet-detail-shell">
    <section class="pet-hero" aria-labelledby="pet-detail-title">
      <div>
        <p class="eyebrow">Área privada</p>
        <h1 class="page-title" id="pet-detail-title" data-pet-title>Ficha de la mascota</h1>
        <p class="lead">Consulta su información, historial veterinario, vacunas y documentación.</p>
      </div>
      <a class="button secondary hero-action" href="/dashboard">Volver al panel</a>
    </section>

    <p class="status" data-status aria-live="polite">Cargando...</p>

    <section class="pet-detail-grid">
      <div class="panel pet-profile-panel" data-pet-card></div>
      <div class="panel pet-section-card">
        <div class="section-heading">
          <span class="section-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><path d="M4 9h16"/><path d="M6.5 4h11A2.5 2.5 0 0 1 20 6.5v11A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5v-11A2.5 2.5 0 0 1 6.5 4Z"/><path d="m9 15 2 2 4-5"/></svg>
          </span>
          <h2 class="section-title">Próximas vacunas y tratamientos</h2>
        </div>
        <div class="list" data-upcoming-list></div>
      </div>
    </section>

    <section class="panel pet-section-card pet-wide-section">
      <div class="section-heading">
        <span class="section-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M9 5h6"/><path d="M9 3h6v4H9z"/><path d="M7 5H5.75A1.75 1.75 0 0 0 4 6.75v12.5C4 20.2 4.8 21 5.75 21h12.5c.95 0 1.75-.8 1.75-1.75V6.75C20 5.8 19.2 5 18.25 5H17"/><path d="M8 12h8"/><path d="M8 16h5"/></svg>
        </span>
        <h2 class="section-title">Historial oficial de la clínica</h2>
      </div>
      <div class="list" data-records-list></div>
    </section>

    <section class="panel pet-section-card pet-wide-section">
      <div class="section-heading">
        <span class="section-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M14 2H7.5A2.5 2.5 0 0 0 5 4.5v15A2.5 2.5 0 0 0 7.5 22h9A2.5 2.5 0 0 0 19 19.5V7z"/><path d="M14 2v5h5"/><path d="M8 13h8"/><path d="M8 17h5"/></svg>
        </span>
        <h2 class="section-title">Documentación de la mascota</h2>
      </div>
      <div class="list" data-documents-list></div>
    </section>
  </main>

  <script type="module" src="/pet-detail.js?v=20260527-flip-card"></script>
</body>
</html>
