name: Keep Supabase awake

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sf -o /dev/null -w "%{http_code}\n" \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/get_reserved_reservation_slots" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"p_month\": \"$(date +%Y-%m)\"}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  # GitHub desactiva los workflows programados tras 60 días sin actividad en el
  # repo. Si el último commit tiene más de 50 días, se hace uno vacío.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Empty commit if the repo has been idle for 50 days
        run: |
          last_commit=$(git log -1 --format=%ct)
          idle_days=$(( ($(date +%s) - last_commit) / 86400 ))
          echo "Days since last commit: ${idle_days}"
          if [ "$idle_days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive for scheduled workflows"
            git push
          fi
