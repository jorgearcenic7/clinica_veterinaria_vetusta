<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel cliente - Clinica Veterinaria Vetusta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/client-area.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M11.25 16.25c-2.2 0-4.25 1.35-4.25 3.05 0 1.2.95 2.05 2.2 2.05.95 0 1.55-.45 2.8-.45s1.85.45 2.8.45c1.25 0 2.2-.85 2.2-2.05 0-1.7-2.05-3.05-4.25-3.05h-1.5Z"/><path d="M5.35 11.1c.9-.2 1.45-1.25 1.2-2.35-.25-1.1-1.2-1.85-2.1-1.65-.9.2-1.45 1.25-1.2 2.35.25 1.1 1.2 1.85 2.1 1.65Z"/><path d="M9.2 8.1c.98-.08 1.68-1.05 1.57-2.18-.1-1.13-.98-1.98-1.96-1.9-.98.08-1.68 1.05-1.57 2.18.1 1.13.98 1.98 1.96 1.9Z"/><path d="M14.8 8.1c.98.08 1.86-.77 1.96-1.9.11-1.13-.59-2.1-1.57-2.18-.98-.08-1.86.77-1.96 1.9-.11 1.13.59 2.1 1.57 2.18Z"/><path d="M18.65 11.1c.9.2 1.85-.55 2.1-1.65.25-1.1-.3-2.15-1.2-2.35-.9-.2-1.85.55-2.1 1.65-.25 1.1.3 2.15 1.2 2.35Z"/></svg>
        </span>
        Clínica Veterinaria Vetusta
      </a>
      <nav class="nav-actions">
        <button class="secondary" type="button" data-logout>Cerrar sesion</button>
      </nav>
    </div>
  </header>

  <main class="shell">
    <h1 class="page-title">Mis mascotas</h1>
    <p class="lead" data-welcome>Estas son sus mascotas registradas en la clínica.</p>
    <p class="status" data-status aria-live="polite">Cargando...</p>

    <section class="panel dashboard-section">
      <h2 class="section-title">Mis citas</h2>
      <div class="reservation-list" data-reservations-list></div>
    </section>

    <section class="panel dashboard-section">
      <h2 class="section-title">Mascotas</h2>
      <div class="pet-card-grid" data-pets-list></div>
    </section>
  </main>

  <script type="module" src="/dashboard.js"></script>
</body>
</html>
